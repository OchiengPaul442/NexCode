name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20]
        include:
          # Extra Node.js versions on Linux only to keep matrix bounded
          - os: ubuntu-latest
            node-version: 18
          - os: ubuntu-latest
            node-version: 22
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check agent-core
        run: npm run -w agent-core lint

      - name: Build agent-core (required for extension type-check)
        run: npm run -w agent-core build

      - name: Type-check extension
        run: npm run -w extension lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Audit all dependencies
        run: npm audit --audit-level=high
        # Track but do not block on high-severity advisories that may
        # require manual review. Critical advisories above already block.
        continue-on-error: true

      - name: Verify lockfile integrity
        run: npm ci --ignore-scripts 2>&1 | head -5
        # A clean npm ci from a fresh checkout is the primary lockfile
        # integrity check. If the lockfile is out of sync, npm ci fails.

  package:
    runs-on: ${{ matrix.os }}
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package VSIX
        run: npx @vscode/vsce package --allow-missing-repository
        working-directory: extension

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-package-${{ matrix.os }}
          path: extension/*.vsix
          retention-days: 30
